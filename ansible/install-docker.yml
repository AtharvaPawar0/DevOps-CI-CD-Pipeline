
---
- name: Install Docker on EC2
  hosts: webservers
  become: yes

  tasks:
    - name: Update Ubuntu package list
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes
